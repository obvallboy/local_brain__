name: Device Integrator CI

# Run the full test suite — including the Flask API tests — on every push and
# pull request that touches the app.
on:
  push:
    paths:
      - "device-integrator/**"
      - ".github/workflows/device-integrator-ci.yml"
  pull_request:
    paths:
      - "device-integrator/**"
      - ".github/workflows/device-integrator-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: device-integrator

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: device-integrator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved backends
        run: |
          python -c "import json; from integrator import discovery; print(json.dumps(discovery.capabilities(), indent=2))"

      - name: Run tests
        run: pytest -q
