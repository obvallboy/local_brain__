title = "SPI NOR flash / BIOS (flashrom via the Pi's hardware SPI)"
summary = "Dump, verify and reflash a laptop/board BIOS chip at a safe 3.3 V — the real counterpart to the Device Bench's spiflash emulator."
device = "SPI NOR flash, 25-series SOIC-8 (W25Q*, MX25L*, GD25*), 3.3 V"
interface = "spi0 (/dev/spidev0.0)"

[setup]
packages = ["flashrom"]
enable = ["SPI: sudo raspi-config → Interface Options → SPI → Enable (or add dtparam=spi=on), then reboot"]
notes = [
  "The Pi's GPIO SPI is 3.3 V — correct for these chips, so NO level shifter and none of the CH341A 5 V risk.",
  "Power the target OFF and unplug its battery before you clip on.",
  "In-circuit can be flaky (the board loads the bus / back-powers). If reads don't match, the chip may have to come off the board.",
  "Golden rule: get a verified dump FIRST and keep it untouched. Edit a COPY, write the copy back.",
]

# Chip pin -> Pi 40-pin header. Match pin 1 on both (chip pin 1 is by the dot).
[[wiring]]
chip = "1"
signal = "CS#"
pi = "24"
pi_label = "SPI0 CE0 (GPIO8)"
[[wiring]]
chip = "2"
signal = "DO / MISO"
pi = "21"
pi_label = "SPI0 MISO (GPIO9)"
[[wiring]]
chip = "3"
signal = "WP#"
pi = "1 or 17"
pi_label = "3V3 (tie high = not write-protected)"
[[wiring]]
chip = "4"
signal = "GND"
pi = "6"
pi_label = "GND"
[[wiring]]
chip = "5"
signal = "DI / MOSI"
pi = "19"
pi_label = "SPI0 MOSI (GPIO10)"
[[wiring]]
chip = "6"
signal = "CLK"
pi = "23"
pi_label = "SPI0 SCLK (GPIO11)"
[[wiring]]
chip = "7"
signal = "HOLD# / RESET#"
pi = "1 or 17"
pi_label = "3V3 (tie high)"
[[wiring]]
chip = "8"
signal = "VCC"
pi = "1 or 17"
pi_label = "3V3"

[vars]
dev = "/dev/spidev0.0"
spispeed = "512"
image = "bios.bin"

[actions.probe]
desc = "Detect the chip only — no read or write. Run this first; it prints the chip's name/size."
commands = ["sudo flashrom -p linux_spi:dev={dev},spispeed={spispeed}"]

[actions.read]
desc = "Read the chip TWICE and confirm the two dumps are identical (a trustworthy backup)."
commands = [
  "sudo flashrom -p linux_spi:dev={dev},spispeed={spispeed} -r {image}.1",
  "sudo flashrom -p linux_spi:dev={dev},spispeed={spispeed} -r {image}.2",
  "cmp {image}.1 {image}.2 && cp {image}.1 {image} && sha256sum {image} && echo 'VERIFIED: two reads match -> {image} (keep this backup)' || echo 'READS DIFFER — reseat the clip, lower spispeed, retry'",
]

[actions.verify]
desc = "Re-read the chip and compare it against {image} (use after a write, or to re-check a backup)."
commands = ["sudo flashrom -p linux_spi:dev={dev},spispeed={spispeed} -v {image}"]

[actions.write]
desc = "Write {image} back to the chip. Writes only the blocks that changed."
destructive = true
commands = ["sudo flashrom -p linux_spi:dev={dev},spispeed={spispeed} -w {image}"]
