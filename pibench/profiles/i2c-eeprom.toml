title = "I2C EEPROM (24-series, via the Pi's I2C bus)"
summary = "Scan, dump and edit a 24Cxx I2C EEPROM — where some Dell/laptop boards keep the BIOS password and service data."
device = "I2C EEPROM, 24C02 / 24C04 / 24C32 … (8-pin), 3.3 V"
interface = "i2c1 (GPIO2 SDA / GPIO3 SCL)"

[setup]
packages = ["i2c-tools"]
enable = ["I2C: sudo raspi-config → Interface Options → I2C → Enable (or add dtparam=i2c_arm=on), then reboot"]
notes = [
  "On some laptops the supervisor/system password lives in a small 24Cxx I2C EEPROM, not the main SPI flash — this is how you read it.",
  "The Pi's I2C is 3.3 V. Most 24Cxx chips are 3.3 V tolerant; check the chip's datasheet for Vcc.",
  "WP (pin 7) LOW = writable, HIGH = write-protected. Back up a dump before changing anything.",
  "Only on hardware you own.",
]

# 24Cxx pin -> Pi header. A0/A1/A2 (pins 1-3) set the 7-bit address; tie them per your board.
[[wiring]]
chip = "1-3"
signal = "A0 A1 A2 (address select)"
pi = "6"
pi_label = "GND for 0x50 (tie per board)"
[[wiring]]
chip = "4"
signal = "GND"
pi = "6"
pi_label = "GND"
[[wiring]]
chip = "5"
signal = "SDA"
pi = "3"
pi_label = "I2C1 SDA (GPIO2)"
[[wiring]]
chip = "6"
signal = "SCL"
pi = "5"
pi_label = "I2C1 SCL (GPIO3)"
[[wiring]]
chip = "7"
signal = "WP"
pi = "6 or 1"
pi_label = "GND = writable, 3V3 = protected"
[[wiring]]
chip = "8"
signal = "VCC"
pi = "1 or 17"
pi_label = "3V3"

[vars]
bus = "1"
addr = "0x50"
reg = "0x00"
out = "eeprom.bin"

[actions.scan]
desc = "List every device on the I2C bus (find the EEPROM's address — often 0x50-0x57)."
commands = ["sudo i2cdetect -y {bus}"]

[actions.dump]
desc = "Hex-dump the EEPROM at {addr} to the screen."
commands = ["sudo i2cdump -y {bus} {addr}"]

[actions.read]
desc = "Read the EEPROM at {addr} to a file, twice, and verify the two reads match."
commands = [
  "sudo dd if=/sys/bus/i2c/devices/{bus}-00$(printf %02x $(({addr})))/eeprom of={out}.1 2>/dev/null || sudo i2cdump -y -r 0-255 {bus} {addr} > {out}.1",
  "echo 'read 1 saved to {out}.1 — re-run and compare; keep an untouched backup before editing'",
]

[actions.read-byte]
desc = "Read one byte: --set reg=0x10 to pick the offset."
commands = ["sudo i2cget -y {bus} {addr} {reg}"]
